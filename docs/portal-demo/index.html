  function bindLogin() {
    document.querySelectorAll('[data-role]').forEach(btn => btn.addEventListener('click', () => {
      loginRole = btn.getAttribute('data-role');
      authError = '';
      render();
    }));
    document.getElementById('toggle-theme')?.addEventListener('click', () => { setTheme(themeMode()==='dark'?'light':'dark'); render(); });
    document.getElementById('login-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = e.target.username.value.trim();
      const password = e.target.password.value;
      if (!username || !password) { authError = '请输入用户名和密码'; render(); return; }
      const role = loginRole;
      saveAuth({
        role,
        username,
        display_name: role === 'admin' ? (username === 'admin' ? '控制台管理员' : username) : (username === 'trial' ? '试用客户' : username),
      });
      authError = '';
      navigate(homePath({ role }));
    });
  }

  function sparkline(values, opts = {}) {
    const w = 320, h = 120, padX = 4, padY = 10;
    const max = Math.max(...values, 0.0001);
    const min = Math.min(...values, 0);
    const span = Math.max(max - min, max * 0.08, 0.0001);
    const n = values.length;
    const pts = values.map((v, i) => {
      const x = padX + (n === 1 ? w/2 : (i / (n - 1)) * (w - padX * 2));
      const y = h - padY - ((v - min) / span) * (h - padY * 2);
      return [x, y];
    });
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    const area = `${line} L${pts[pts.length-1][0].toFixed(1)},${h - padY} L${pts[0][0].toFixed(1)},${h - padY} Z`;
    const last = pts[pts.length - 1];
    return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <line class="grid-line" x1="${padX}" y1="${h/2}" x2="${w-padX}" y2="${h/2}" />
      <path class="area" d="${area}" />
      <path class="line" d="${line}" />
      <circle class="dot" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" />
    </svg>`;
  }

  }

            <div><dt>Token</dt><dd>输入 ${fmt(e.input)} · 输出 ${fmt(e.output)}</dd></div>
            <div><dt>费用</dt><dd>${fmtUSD(e.cost)}</dd></div>
            <div style="grid-column:1/-1"><dt>错误信息</dt><dd>${e.error ? `<span class="mono" style="color:var(--danger)">${e.error}</span>` : '<span style="color:var(--muted)">—</span>'}</dd></div>
          </div></td></tr>` : ''}
        `).join('') : `<tr><td colspan="7" style="color:var(--muted);text-align:center">没有匹配的记录</td></tr>`}</tbody>
      </table></div>`;
  }

  function pagePortalWallet() {
    return `
      <div class="terminal-page-head"><div class="terminal-page-heading">
        <h1 class="terminal-title">钱包</h1>
        <p class="terminal-subtitle">余额 · 兑换码 · 流水 · 全部为演示数据</p>
      </div></div>
      <div class="grid-two">
        <div class="panel">
          <div class="panel-title">当前余额</div>
          <div class="wallet-balance"><span class="amt">${fmtUSD(walletBalance)}</span><span class="unit">USD · 演示</span></div>
          <p class="footer-note">用量成功后从余额扣减；余额不足时上游请求会被拒绝（产品行为示意）。</p>
        </div>
        <div class="panel">
          <div class="panel-title">兑换码充值</div>
          <div class="redeem-row">
            <div class="field"><label>兑换码</label><input id="redeem-code" placeholder="例如 OMC-DEMO-100" autocomplete="off" /></div>
            <button class="btn btn-primary" id="do-redeem" type="button">兑换</button>
          </div>
          ${redeemMsg ? `<div class="omc-notice" style="margin-top:12px">${redeemMsg}</div>` : `<p class="footer-note">试用码：<code class="mono">OMC-DEMO-100</code>、<code class="mono">TRY-ME-50</code>、<code class="mono">WELCOME-20</code></p>`}
        </div>
      </div>
      <div class="panel" style="padding:0;overflow:hidden">
        <div class="panel-title" style="padding:16px 20px 0">流水</div>
        <div class="data-table" style="border:0;border-radius:0">
          <table>
            <thead><tr><th>时间</th><th>类型</th><th>说明</th><th class="num">变动</th><th class="num">余额</th></tr></thead>
            <tbody>${walletLedger.map(r => {
              const typeTag = r.type==='redeem' ? '<span class="tag is-accent is-small">兑换</span>'
                : r.type==='grant' ? '<span class="tag is-success is-small">赠送</span>'
                : '<span class="tag is-small">用量</span>';
              const amt = r.amount >= 0 ? `<span style="color:var(--success)">+${fmtUSD(r.amount)}</span>` : `<span style="color:var(--danger)">${fmtUSD(r.amount)}</span>`;
              return `<tr><td>${r.time}</td><td>${typeTag}</td><td>${r.label}</td><td class="num">${amt}</td><td class="num">${fmtUSD(r.balance)}</td></tr>`;
            }).join('')}</tbody>
          </table>
        </div>
      </div>`;
  }

  function pagePortalAccount(auth) {
    return `
      <div class="terminal-page-head"><div class="terminal-page-heading">
        <h1 class="terminal-title">账户</h1>
        <p class="terminal-subtitle">资料与密码 · 演示数据</p>
      </div></div>
      <div class="grid-two">
        <div class="panel"><div class="panel-title">资料</div>
          <dl class="fact-list">
            <div class="fact-list-row"><dt>用户名</dt><dd class="mono">${auth.username}</dd></div>
            <div class="fact-list-row"><dt>显示名称</dt><dd>${auth.display_name || '—'}</dd></div>
            <div class="fact-list-row"><dt>钱包余额</dt><dd><a href="#/portal/wallet">${fmtUSD(walletBalance)}</a></dd></div>
          </dl>
        </div>
        <div class="panel"><div class="panel-title">修改密码</div>
          <div class="field"><label>当前密码</label><input type="password" placeholder="演示中不会真正修改" /></div>
          <div class="field"><label>新密码</label><input type="password" /></div>
          <button class="btn btn-primary" id="fake-password" type="button">保存（演示）</button>
        </div>
      </div>`;
  }

  function renderCreateModal() {
    return `<div class="modal-backdrop" data-backdrop="create"><div class="modal" role="dialog" aria-modal="true">
      <h3>创建密钥</h3>
      <p>创建成功后会弹出<strong>一次性明文</strong>，请立即复制；关闭后无法再查看。</p>
      <div class="field"><label>名称</label><input id="new-key-name" value="演示密钥" maxlength="40" /></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancel-create" type="button">取消</button>
        <button class="btn btn-primary" id="confirm-create" type="button">创建</button>
      </div>
    </div></div>`;
  }

  function renderIssuedModal() {
    return `<div class="modal-backdrop" data-backdrop="issued"><div class="modal wide" role="dialog" aria-modal="true">
      <h3>密钥已创建</h3>
      <p>这是<strong>唯一</strong>一次展示明文。复制后请妥善保存。（演示值）</p>
      <div class="secret warn-once"><span id="issued-text">${issuedSecret}</span>
        <button class="btn btn-primary btn-sm" id="copy-secret" type="button">复制</button>
      </div>
      <div class="modal-actions"><button class="btn btn-primary" id="close-issued" type="button">我已保存</button></div>
    </div></div>`;
  }

  function renderRevokeModal() {
    const k = revokeTarget;
    return `<div class="modal-backdrop" data-backdrop="revoke"><div class="modal" role="dialog" aria-modal="true">
      <h3>撤销密钥</h3>
      <p>确认撤销「<strong>${k.name}</strong>」（<span class="mono">${k.prefix}…${k.last4}</span>）？撤销后立即失效，不可恢复。</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancel-revoke" type="button">取消</button>
        <button class="btn btn-danger" id="confirm-revoke" type="button">确认撤销</button>
      </div>
    </div></div>`;
  }

  function showToast(msg) {
    toastMsg = msg;
    render();
    setTimeout(() => { if (toastMsg === msg) { toastMsg = ''; render(); } }, 1800);
  }

  function copyText(str) {
    return navigator.clipboard.writeText(str).then(() => true).catch(() => {
      try {
        const ta = document.createElement('textarea');
        ta.value = str; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove(); return true;
      } catch { return false; }
    });
  }

  function bindShell(auth) {
    document.querySelectorAll('[data-nav]').forEach(btn => btn.addEventListener('click', () => {
      mobileNavOpen = false; navigate(btn.getAttribute('data-nav'));
    }));
    document.getElementById('brand-home')?.addEventListener('click', () => { mobileNavOpen = false; navigate(homePath(auth)); });
    document.getElementById('sign-out')?.addEventListener('click', () => {
      saveAuth(null); issuedSecret=null; createOpen=false; revokeTarget=null; mobileNavOpen=false; navigate('/login');
    });
    document.getElementById('toggle-collapse')?.addEventListener('click', () => {
      collapsed=!collapsed; localStorage.setItem(COLLAPSE_KEY, collapsed?'1':'0'); render();
    });
    document.getElementById('open-mobile-nav')?.addEventListener('click', () => { mobileNavOpen=true; render(); });
    document.getElementById('mobile-mask')?.addEventListener('click', () => { mobileNavOpen=false; render(); });
    document.getElementById('toggle-theme')?.addEventListener('click', () => {
      setTheme(themeMode()==='dark'?'light':'dark'); render();
    });

    // Keys: create → issued → copy → revoke confirm
    document.getElementById('open-create')?.addEventListener('click', () => { createOpen=true; render(); });
    document.getElementById('cancel-create')?.addEventListener('click', () => { createOpen=false; render(); });
    document.getElementById('confirm-create')?.addEventListener('click', () => {
      const name = document.getElementById('new-key-name')?.value?.trim() || '演示密钥';
      if (portalKeys.filter(k => k.state === 'active').length >= 5) {
        showToast('已达可用密钥上限（5）'); return;
      }
      const rand = Math.random().toString(36).slice(2, 14);
      issuedSecret = 'sk-omc-DEMO' + rand + 'X';
      const now = new Date();
      const stamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      portalKeys.unshift({
        id: Date.now(), name,
        prefix: issuedSecret.slice(0, 12), last4: issuedSecret.slice(-4),
        state: 'active', requests: 0, last_used: '—', created: stamp,
      });
      createOpen = false; render();
    });
    document.getElementById('close-issued')?.addEventListener('click', () => { issuedSecret=null; render(); });
    document.getElementById('copy-secret')?.addEventListener('click', async () => {
      const ok = await copyText(issuedSecret || '');
      showToast(ok ? '已复制到剪贴板' : '复制失败，请手动选择');
    });
    document.querySelectorAll('[data-revoke]').forEach(btn => btn.addEventListener('click', () => {
      const id = Number(btn.getAttribute('data-revoke'));
      revokeTarget = portalKeys.find(x => x.id === id) || null;
      render();
    }));
    document.getElementById('cancel-revoke')?.addEventListener('click', () => { revokeTarget=null; render(); });
    document.getElementById('confirm-revoke')?.addEventListener('click', () => {
      if (revokeTarget) {
        const k = portalKeys.find(x => x.id === revokeTarget.id);
        if (k) k.state = 'revoked';
        showToast(`已撤销「${revokeTarget.name}」`);
        revokeTarget = null;
      } else render();
    });

    // Usage filters + row detail
    const applyFlt = () => {
      usageFilter = {
        key: document.getElementById('flt-key')?.value || '',
        model: document.getElementById('flt-model')?.value || '',
        result: document.getElementById('flt-result')?.value || '',
      };
      usageDetailId = null;
      render();
    };
    document.getElementById('flt-key')?.addEventListener('change', applyFlt);
    document.getElementById('flt-model')?.addEventListener('change', applyFlt);
    document.getElementById('flt-result')?.addEventListener('change', applyFlt);
    document.getElementById('flt-reset')?.addEventListener('click', () => {
      usageFilter = { key: '', model: '', result: '' }; usageDetailId = null; render();
    });
    document.querySelectorAll('[data-usage-row]').forEach(tr => tr.addEventListener('click', () => {
      const id = Number(tr.getAttribute('data-usage-row'));
      usageDetailId = usageDetailId === id ? null : id;
      render();
    }));

    // Wallet redeem
    document.getElementById('do-redeem')?.addEventListener('click', () => {
      const raw = (document.getElementById('redeem-code')?.value || '').trim().toUpperCase();
      if (!raw) { redeemMsg = '请输入兑换码'; render(); return; }
      const amt = DEMO_REDEEM_CODES[raw];
      if (!amt) { redeemMsg = `无效兑换码「${raw}」（演示）`; render(); return; }
      walletBalance = Math.round((walletBalance + amt) * 100) / 100;
      const now = new Date();
      const stamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      walletLedger.unshift({ time: stamp, type: 'redeem', label: `兑换码 ${raw}`, amount: amt, balance: walletBalance });
      redeemMsg = `兑换成功，到账 ${fmtUSD(amt)}`;
      showToast(`余额 +${fmtUSD(amt)}`);
    });

    // Copy helpers (gateway howto)
    document.querySelectorAll('[data-copy]').forEach(btn => btn.addEventListener('click', async () => {
      const ok = await copyText(btn.getAttribute('data-copy') || '');
      showToast(ok ? '已复制' : '复制失败');
    }));
    document.querySelectorAll('[data-copy-id]').forEach(btn => btn.addEventListener('click', async () => {
      const el = document.getElementById(btn.getAttribute('data-copy-id'));
      const ok = await copyText(el?.textContent || '');
      showToast(ok ? '已复制' : '复制失败');
    }));

    document.getElementById('fake-password')?.addEventListener('click', () => showToast('静态演示，不会修改密码'));
    document.getElementById('fake-create-customer')?.addEventListener('click', () => showToast('静态演示：真实产品会打开创建客户表单'));
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
