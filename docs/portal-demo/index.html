  function loadAuth() { try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch { return null; } }

  function fmt(n) { return new Intl.NumberFormat('zh-CN').format(n); }
  function fmtTokens(n) { if (n >= 1e6) return (n/1e6).toFixed(n>=1e7?1:2)+'M'; if (n>=1e3) return (n/1e3).toFixed(1)+'K'; return fmt(n); }

  }
  function route() {
    const h = (location.hash || '').replace(/^#/, '') || '';
    return h.startsWith('/') ? h : (h ? '/' + h : '');
  }
  function navigate(path) { location.hash = path.startsWith('#') ? path : '#' + path; }

  function navFor(auth) { return auth.role === 'admin' ? ADMIN_NAV : PORTAL_NAV; }
  function flatNav(auth) { return navFor(auth).flatMap(g => g.items.map(i => ({ ...i, group: g.group }))); }
  function homePath(auth) { return auth.role === 'admin' ? '/dashboard' : '/portal/overview'; }
  function findItem(auth, path) {
    const items = flatNav(auth);
    return items.find(i => path === i.path || path.startsWith(i.path + '/')) || items[0];
  }

  function render() {
    const app = document.getElementById('app');
    const auth = loadAuth();
    let path = route();

    if (!auth) {
      if (path && path !== '/login') { navigate('/login'); return; }
      app.innerHTML = renderLogin();
      bindLogin();
      return;
    }

    // Role gates: customer cannot open admin routes
    if (auth.role === 'customer' && !path.startsWith('/portal')) {
      navigate(homePath(auth)); return;
    }
    if (auth.role === 'admin' && (path.startsWith('/portal') || !path)) {
      // admin may still peek portal? No — 皇上 said admin enters management console.
      if (!path || path === '/' || path === '/login' || path.startsWith('/portal')) {
        navigate(homePath(auth)); return;
      }
    }
    if (!path || path === '/login') { navigate(homePath(auth)); return; }

    const item = findItem(auth, path);
    // If path unknown for role, bounce home
    if (!flatNav(auth).some(i => path === i.path || path.startsWith(i.path + '/'))) {
      navigate(homePath(auth)); return;
    }

  function bindLogin() {
    document.querySelectorAll('[data-role]').forEach(btn => btn.addEventListener('click', () => {
      loginRole = btn.getAttribute('data-role');
      authError = '';
      render();
    }));
    document.getElementById('toggle-theme')?.addEventListener('click', () => { setTheme(themeMode()==='dark'?'light':'dark'); render(); });
    document.getElementById('login-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = e.target.username.value.trim();
      const password = e.target.password.value;
      if (!username || !password) { authError = '请输入用户名和密码'; render(); return; }
      const role = loginRole;
      saveAuth({
        role,
        username,
        display_name: role === 'admin' ? (username === 'admin' ? '控制台管理员' : username) : (username === 'trial' ? '试用客户' : username),
      });
      authError = '';
      navigate(homePath({ role }));
    });
  }

  function pagePortalKeys() {

        <thead><tr><th>名称</th><th>密钥</th><th>状态</th><th class="num">请求</th><th>最近使用</th><th></th></tr></thead>

          <tr>
            <td>${k.name}</td><td class="mono">${k.prefix}…${k.last4}</td>

  function renderCreateModal() {
    return `<div class="modal-backdrop"><div class="modal"><h3>创建密钥</h3><p>完整密钥只展示一次。</p>
      <div class="field"><label>名称</label><input id="new-key-name" value="演示密钥" /></div>
      <div class="modal-actions"><button class="btn btn-ghost" id="cancel-create" type="button">取消</button>
      <button class="btn btn-primary" id="confirm-create" type="button">创建</button></div></div></div>`;
  }
  function renderIssuedModal() {
    return `<div class="modal-backdrop"><div class="modal"><h3>密钥已创建</h3>
      <p>请立即复制保存。<strong>（演示值）</strong></p>
      <div class="secret"><span>${issuedSecret}</span><button class="btn btn-ghost btn-sm" id="copy-secret" type="button">复制</button></div>
      <div class="modal-actions"><button class="btn btn-primary" id="close-issued" type="button">我已保存</button></div></div></div>`;
  }

  function bindShell(auth) {
    document.querySelectorAll('[data-nav]').forEach(btn => btn.addEventListener('click', () => {
      mobileNavOpen = false; navigate(btn.getAttribute('data-nav'));
    }));
    document.getElementById('brand-home')?.addEventListener('click', () => { mobileNavOpen = false; navigate(homePath(auth)); });
    document.getElementById('sign-out')?.addEventListener('click', () => { saveAuth(null); issuedSecret=null; createOpen=false; mobileNavOpen=false; navigate('/login'); });
    document.getElementById('toggle-collapse')?.addEventListener('click', () => { collapsed=!collapsed; localStorage.setItem(COLLAPSE_KEY, collapsed?'1':'0'); render(); });
    document.getElementById('open-mobile-nav')?.addEventListener('click', () => { mobileNavOpen=true; render(); });
    document.getElementById('mobile-mask')?.addEventListener('click', () => { mobileNavOpen=false; render(); });
    document.getElementById('toggle-theme')?.addEventListener('click', () => { setTheme(themeMode()==='dark'?'light':'dark'); render(); });
    document.getElementById('open-create')?.addEventListener('click', () => { createOpen=true; render(); });
    document.getElementById('cancel-create')?.addEventListener('click', () => { createOpen=false; render(); });
    document.getElementById('confirm-create')?.addEventListener('click', () => {
      const name = document.getElementById('new-key-name')?.value?.trim() || '演示密钥';
      const rand = Math.random().toString(36).slice(2,12);
      issuedSecret = 'sk-omc-DEMO' + rand + 'DEMO';
      portalKeys.unshift({ id: Date.now(), name, prefix: issuedSecret.slice(0,12), last4: issuedSecret.slice(-4), state: 'active', requests: 0, last_used: '—', created: new Date().toISOString().slice(0,16).replace('T',' ') });
      createOpen=false; render();
    });
    document.getElementById('close-issued')?.addEventListener('click', () => { issuedSecret=null; render(); });
    document.getElementById('copy-secret')?.addEventListener('click', async () => { try { await navigator.clipboard.writeText(issuedSecret); } catch {} });
    document.querySelectorAll('[data-revoke]').forEach(btn => btn.addEventListener('click', () => {
      const id = Number(btn.getAttribute('data-revoke'));
      const k = portalKeys.find(x => x.id === id);
      if (k && confirm(`撤销「${k.name}」？（演示）`)) { k.state='revoked'; render(); }
    }));
    document.getElementById('fake-password')?.addEventListener('click', () => alert('静态演示，不会修改密码。'));
    document.getElementById('fake-create-customer')?.addEventListener('click', () => alert('静态演示：真实产品里这里会打开创建客户表单。'));
  }

  window.addEventListener('hashchange', render);
  render();
})();
