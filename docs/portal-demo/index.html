<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oh My CPA · 客户门户演示</title>
<meta name="description" content="Oh My CPA P1 客户门户静态演示（演示数据，无真实后端）" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='white' font-size='14' font-family='system-ui'%3Eo%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #f4f5f7;
    --bg-elevated: #ffffff;
    --bg-surface: #f0f1f4;
    --fg: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --border-soft: #eef0f3;
    --accent: #4f46e5;
    --accent-fg: #ffffff;
    --success: #059669;
    --success-bg: #ecfdf5;
    --warn: #d97706;
    --warn-bg: #fffbeb;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --neutral-bg: #f3f4f6;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.04);
    --font: "Inter", "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12;
      --bg-elevated: #141821;
      --bg-surface: #1a1f2b;
      --fg: #e5e7eb;
      --muted: #9ca3af;
      --border: #2a3140;
      --border-soft: #1f2533;
      --accent: #818cf8;
      --accent-fg: #0b0d12;
      --success: #34d399;
      --success-bg: #064e3b;
      --warn: #fbbf24;
      --warn-bg: #451a03;
      --danger: #f87171;
      --danger-bg: #450a0a;
      --neutral-bg: #1f2533;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    line-height: 1.5;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input {
    font: inherit;
  }
  .banner {
    background: linear-gradient(90deg, #4f46e5, #7c3aed);
    color: #fff;
    padding: 10px 16px;
    text-align: center;
    font-size: 14px;
  }
  .banner strong { font-weight: 700; }
  .banner a { color: #fff; text-decoration: underline; }

  /* Auth */
  .auth-shell { min-height: calc(100vh - 42px); display: flex; flex-direction: column; }
  .auth-main { flex: 1; display: grid; place-items: center; padding: 24px; }
  .auth-card {
    width: 100%; max-width: 400px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 28px 20px;
  }
  .auth-brand { display: flex; justify-content: center; margin-bottom: 16px; }
  .auth-brand img { height: 28px; }
  .auth-title { margin: 0 0 8px; font-size: 22px; text-align: center; }
  .auth-sub { margin: 0 0 20px; color: var(--muted); text-align: center; font-size: 14px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--muted); }
  .field input {
    width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--bg); color: var(--fg);
  }
  .field input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 9px 14px; cursor: pointer; font-weight: 560;
    background: var(--bg-surface); color: var(--fg);
  }
  .btn:hover { filter: brightness(0.98); }
  .btn-primary { background: var(--accent); color: var(--accent-fg); }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-ghost { background: transparent; border-color: var(--border); }
  .btn-danger { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
  .btn-block { width: 100%; }
  .btn-link { background: none; border: none; color: var(--accent); padding: 8px; cursor: pointer; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin-top: 12px; }
  .error {
    background: var(--danger-bg); color: var(--danger);
    border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 12px; font-size: 14px;
  }

  /* Shell */
  .shell { min-height: calc(100vh - 42px); display: flex; flex-direction: column; }
  .header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 24px; border-bottom: 1px solid var(--border-soft);
    background: var(--bg-elevated);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .brand img { height: 22px; }
  .brand .suffix { opacity: 0.7; font-weight: 500; font-size: 13px; }
  .nav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  .nav a {
    padding: 6px 12px; border-radius: 999px; color: var(--muted); font-size: 14px; font-weight: 500;
  }
  .nav a:hover { background: var(--bg-surface); text-decoration: none; color: var(--fg); }
  .nav a.active { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .user { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .main {
    width: 100%; max-width: 1120px; margin: 0 auto; padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .page-title { margin: 0; font-size: 24px; }
  .page-sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }

  .panel {
    background: var(--bg-elevated); border: 1px solid var(--border-soft);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px;
  }
  .panel h3 { margin: 0 0 12px; font-size: 15px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .stat-label { font-size: 13px; opacity: 0.7; }
  .stat-value { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .stat-meta { font-size: 12px; opacity: 0.7; margin-top: 4px; }
  .grid-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border-soft); }
  th { color: var(--muted); font-weight: 550; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .tag {
    display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 560;
  }
  .tag-success { background: var(--success-bg); color: var(--success); }
  .tag-warn { background: var(--warn-bg); color: var(--warn); }
  .tag-neutral { background: var(--neutral-bg); color: var(--muted); }
  .tag-danger { background: var(--danger-bg); color: var(--danger); }

  .secret {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 12px; border-radius: var(--radius-sm);
    background: var(--bg-surface); font-family: var(--mono); font-size: 13px; word-break: break-all;
  }
  .notice {
    background: color-mix(in srgb, var(--accent) 10%, var(--bg-elevated));
    border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--border));
    border-radius: var(--radius-sm); padding: 12px 14px; font-size: 14px;
  }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(15,23,42,.45);
    display: grid; place-items: center; padding: 16px; z-index: 50;
  }
  .modal {
    width: min(480px, 100%); background: var(--bg-elevated); border-radius: var(--radius);
    border: 1px solid var(--border); box-shadow: var(--shadow); padding: 20px;
  }
  .modal h3 { margin: 0 0 8px; }
  .modal p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .empty { text-align: center; color: var(--muted); padding: 24px 8px; font-size: 14px; }
  .footer-note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  @media (max-width: 640px) {
    .header { padding: 12px 16px; }
    .main { padding: 16px; }
  }
  .wordmark-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    .wordmark-light { display: none; }
    .wordmark-dark { display: inline; }
  }
</style>
</head>
<body>
  <div class="banner">
    <strong>静态 UI 演示 · 演示数据</strong>
    — 这不是真实 CPA / Oh My CPA 后端。密钥不会同步到网关，也无法发起真实 AI 请求。
    源码与部署说明见
    <a href="https://github.com/ibi6/oh-my-cpa/tree/feat/distribution-p1" target="_blank" rel="noopener">ibi6/oh-my-cpa</a>
  </div>
  <div id="app"></div>

<script>
(() => {
  const DEMO_USER = { username: 'trial', display_name: '试用客户', password: 'demo' };
  const STATE_KEY = 'omc-portal-demo-v1';

  const sampleKeys = [
    { id: 1, name: '笔记本', prefix: 'sk-omc-RDkO', last4: 'yADn', state: 'active', requests: 1284, last_used: '2026-10-22 14:18', created: '2026-10-20 09:12' },
    { id: 2, name: 'CI', prefix: 'sk-omc-7pQm', last4: 'k2Lx', state: 'active', requests: 532, last_used: '2026-10-22 11:02', created: '2026-10-18 16:40' },
    { id: 3, name: '旧手机', prefix: 'sk-omc-ab12', last4: '9Zq1', state: 'revoked', requests: 88, last_used: '2026-10-12 08:21', created: '2026-09-30 10:00' },
  ];

  const sampleOverview = {
    window_days: 30,
    totals: { requests: 1816, failed: 23, tokens: 42_580_000, input: 31_200_000, output: 11_380_000, cost: 86.42 },
    last24h: { requests: 96, tokens: 2_140_000 },
    lifetime: { requests: 12450, tokens: 310_000_000 },
    models: [
      { model: 'claude-sonnet-4', requests: 980, tokens: 24_100_000, cost: 52.10 },
      { model: 'gpt-5', requests: 610, tokens: 14_800_000, cost: 28.40 },
      { model: 'gemini-2.5-pro', requests: 226, tokens: 3_680_000, cost: 5.92 },
    ],
    keys: [
      { name: '笔记本', requests: 1284, tokens: 30_200_000, cost: 61.20 },
      { name: 'CI', requests: 532, tokens: 12_380_000, cost: 25.22 },
    ],
    daily: [
      { day: '2026-10-22', requests: 96, failed: 2, tokens: 2_140_000, cost: 4.28 },
      { day: '2026-10-21', requests: 142, failed: 1, tokens: 3_420_000, cost: 6.91 },
      { day: '2026-10-20', requests: 118, failed: 0, tokens: 2_880_000, cost: 5.74 },
      { day: '2026-10-19', requests: 87, failed: 3, tokens: 1_950_000, cost: 3.88 },
      { day: '2026-10-18', requests: 155, failed: 4, tokens: 4_010_000, cost: 8.12 },
    ],
  };

  const sampleEvents = [
    { time: '2026-10-22 14:18:02', key: '笔记本', model: 'claude-sonnet-4', result: '200', input: 4200, output: 910, latency: '1.8s', cost: 0.042 },
    { time: '2026-10-22 14:12:41', key: 'CI', model: 'gpt-5', result: '200', input: 1800, output: 640, latency: '1.1s', cost: 0.021 },
    { time: '2026-10-22 13:55:09', key: '笔记本', model: 'claude-sonnet-4', result: '失败 429', input: 0, output: 0, latency: '0.2s', cost: 0 },
    { time: '2026-10-22 13:40:17', key: '笔记本', model: 'gemini-2.5-pro', result: '200', input: 2600, output: 720, latency: '2.4s', cost: 0.015 },
    { time: '2026-10-22 12:08:33', key: 'CI', model: 'gpt-5', result: '200', input: 950, output: 310, latency: '0.9s', cost: 0.011 },
    { time: '2026-10-22 11:22:05', key: '笔记本', model: 'claude-sonnet-4', result: '200', input: 5100, output: 1200, latency: '2.1s', cost: 0.051 },
  ];

  function loadAuth() {
    try { return JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); } catch { return null; }
  }
  function saveAuth(v) {
    if (v) localStorage.setItem(STATE_KEY, JSON.stringify(v));
    else localStorage.removeItem(STATE_KEY);
  }

  function fmt(n) {
    return new Intl.NumberFormat('zh-CN').format(n);
  }
  function fmtTokens(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return fmt(n);
  }
  function fmtUSD(n) {
    return '$' + Number(n).toFixed(2);
  }

  function wordmark() {
    return `
      <img class="wordmark-light" src="./omc-wordmark-light.svg" alt="Oh My CPA" />
      <img class="wordmark-dark" src="./omc-wordmark-dark.svg" alt="Oh My CPA" />
    `;
  }

  function route() {
    const h = (location.hash || '#/login').replace(/^#/, '') || '/login';
    return h.startsWith('/') ? h : '/' + h;
  }

  function navigate(path) {
    location.hash = path.startsWith('#') ? path : '#' + path;
  }

  let issuedSecret = null;
  let createOpen = false;
  let authError = '';

  function render() {
    const app = document.getElementById('app');
    const path = route();
    const auth = loadAuth();

    if (!auth && path !== '/login') {
      navigate('/login');
      return;
    }
    if (auth && (path === '/login' || path === '/')) {
      navigate('/overview');
      return;
    }

    if (path === '/login') {
      app.innerHTML = renderLogin();
      bindLogin();
      return;
    }

    const page = {
      '/overview': renderOverview,
      '/keys': renderKeys,
      '/usage': renderUsage,
      '/account': renderAccount,
    }[path] || renderOverview;

    app.innerHTML = `
      <div class="shell">
        ${renderHeader(path, auth)}
        <main class="main">${page(auth)}</main>
      </div>
      ${createOpen ? renderCreateModal() : ''}
      ${issuedSecret ? renderIssuedModal() : ''}
    `;
    bindShell();
  }

  function renderLogin() {
    return `
      <div class="auth-shell">
        <main class="auth-main">
          <section class="auth-card">
            <div class="auth-brand">${wordmark()}</div>
            <h1 class="auth-title">登录客户中心</h1>
            <p class="auth-sub">静态演示 · 任意非空密码即可进入（演示数据）</p>
            ${authError ? `<div class="error">${authError}</div>` : ''}
            <form id="login-form">
              <div class="field">
                <label for="username">用户名</label>
                <input id="username" name="username" autocomplete="username" value="trial" spellcheck="false" />
              </div>
              <div class="field">
                <label for="password">密码</label>
                <input id="password" name="password" type="password" autocomplete="current-password" value="demo" />
              </div>
              <button class="btn btn-primary btn-block" type="submit">登录</button>
            </form>
            <p class="hint">推荐账号：<code>trial</code> / <code>demo</code></p>
          </section>
        </main>
      </div>
    `;
  }

  function bindLogin() {
    const form = document.getElementById('login-form');
    form?.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = form.username.value.trim();
      const password = form.password.value;
      if (!username || !password) {
        authError = '请输入用户名和密码';
        render();
        return;
      }
      authError = '';
      saveAuth({
        username,
        display_name: username === 'trial' ? '试用客户' : username,
        signed_in_at: new Date().toISOString(),
      });
      navigate('/overview');
    });
  }

  function renderHeader(path, auth) {
    const items = [
      ['/overview', '概览'],
      ['/keys', 'API 密钥'],
      ['/usage', '使用记录'],
      ['/account', '账户'],
    ];
    return `
      <header class="header">
        <div class="brand">
          ${wordmark()}
          <span class="suffix">客户中心</span>
        </div>
        <nav class="nav">
          ${items.map(([p, label]) => `<a href="#${p}" class="${path === p ? 'active' : ''}">${label}</a>`).join('')}
        </nav>
        <div class="user">
          <span>${auth.display_name || auth.username}</span>
          <button class="btn btn-ghost" id="sign-out" type="button">退出</button>
        </div>
      </header>
    `;
  }

  function renderOverview(auth) {
    const o = sampleOverview;
    return `
      <div class="toolbar">
        <div>
          <h1 class="page-title">${auth.display_name || auth.username}，你好</h1>
          <p class="page-sub">你的 API 使用情况 · <strong>演示数据</strong></p>
        </div>
      </div>
      <div class="notice">接入地址（演示）：<code class="mono">https://api.example.com/v1</code> — 请用你的 API 密钥作为 Bearer。真实环境由运营方配置。</div>
      <div class="stats">
        <div class="panel"><div class="stat-label">近 ${o.window_days} 天请求</div><div class="stat-value">${fmt(o.totals.requests)}</div><div class="stat-meta">失败 ${fmt(o.totals.failed)}</div></div>
        <div class="panel"><div class="stat-label">近 ${o.window_days} 天 Token</div><div class="stat-value">${fmtTokens(o.totals.tokens)}</div><div class="stat-meta">输入 ${fmtTokens(o.totals.input)} · 输出 ${fmtTokens(o.totals.output)}</div></div>
        <div class="panel"><div class="stat-label">近 ${o.window_days} 天费用估算</div><div class="stat-value">${fmtUSD(o.totals.cost)}</div><div class="stat-meta">演示估算</div></div>
        <div class="panel"><div class="stat-label">最近 24 小时请求</div><div class="stat-value">${fmt(o.last24h.requests)}</div><div class="stat-meta">${fmtTokens(o.last24h.tokens)} Token</div></div>
        <div class="panel"><div class="stat-label">累计请求</div><div class="stat-value">${fmt(o.lifetime.requests)}</div><div class="stat-meta">${fmtTokens(o.lifetime.tokens)} Token</div></div>
      </div>
      <div class="grid-two">
        <div class="panel">
          <h3>按模型</h3>
          <table>
            <thead><tr><th>模型</th><th class="num">请求</th><th class="num">Token</th><th class="num">费用</th></tr></thead>
            <tbody>
              ${o.models.map(m => `<tr><td class="mono">${m.model}</td><td class="num">${fmt(m.requests)}</td><td class="num">${fmtTokens(m.tokens)}</td><td class="num">${fmtUSD(m.cost)}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div class="panel">
          <h3>按密钥</h3>
          <table>
            <thead><tr><th>密钥</th><th class="num">请求</th><th class="num">Token</th><th class="num">费用</th></tr></thead>
            <tbody>
              ${o.keys.map(k => `<tr><td>${k.name}</td><td class="num">${fmt(k.requests)}</td><td class="num">${fmtTokens(k.tokens)}</td><td class="num">${fmtUSD(k.cost)}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <h3>按天（UTC）</h3>
        <table>
          <thead><tr><th>日期 (UTC)</th><th class="num">失败</th><th class="num">请求</th><th class="num">Token</th><th class="num">费用</th></tr></thead>
          <tbody>
            ${o.daily.map(d => `<tr><td>${d.day}</td><td class="num">${fmt(d.failed)}</td><td class="num">${fmt(d.requests)}</td><td class="num">${fmtTokens(d.tokens)}</td><td class="num">${fmtUSD(d.cost)}</td></tr>`).join('')}
          </tbody>
        </table>
        <p class="footer-note">按天统计以 UTC 日期为准。以上均为演示数据。</p>
      </div>
    `;
  }

  function stateTag(state) {
    const map = {
      active: ['tag-success', '可用'],
      pending: ['tag-warn', '同步中'],
      missing: ['tag-danger', '缺失'],
      revoked: ['tag-neutral', '已撤销'],
      expired: ['tag-neutral', '已过期'],
      suspended: ['tag-warn', '账户已停用'],
    };
    const [cls, label] = map[state] || ['tag-neutral', state];
    return `<span class="tag ${cls}">${label}</span>`;
  }

  function renderKeys() {
    const active = sampleKeys.filter(k => k.state === 'active').length;
    return `
      <div class="toolbar">
        <div>
          <h1 class="page-title">API 密钥</h1>
          <p class="page-sub">${active} / 5 个可用 · <strong>演示数据</strong></p>
        </div>
        <button class="btn btn-primary" id="open-create" type="button">+ 创建密钥</button>
      </div>
      <div class="panel">
        <table>
          <thead>
            <tr>
              <th>名称</th><th>密钥</th><th>状态</th><th class="num">请求</th><th>最近使用</th><th>创建时间</th><th></th>
            </tr>
          </thead>
          <tbody>
            ${sampleKeys.map(k => `
              <tr>
                <td>${k.name}</td>
                <td class="mono">${k.prefix}…${k.last4}</td>
                <td>${stateTag(k.state)}</td>
                <td class="num">${fmt(k.requests)}</td>
                <td>${k.last_used}</td>
                <td>${k.created}</td>
                <td>${k.state === 'active' ? `<button class="btn btn-danger" data-revoke="${k.id}" type="button">撤销</button>` : ''}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <p class="footer-note">真实环境中，创建的 <code>sk-omc-…</code> 会同步进 CPA 的 access.api-keys；本页只是 UI 演示，不会写入任何网关。</p>
      </div>
    `;
  }

  function renderUsage() {
    return `
      <div class="toolbar">
        <div>
          <h1 class="page-title">使用记录</h1>
          <p class="page-sub">你的每一次请求，最新的在前 · <strong>演示数据</strong></p>
        </div>
      </div>
      <div class="panel">
        <table>
          <thead>
            <tr>
              <th>时间</th><th>密钥</th><th>模型</th><th>结果</th>
              <th class="num">输入</th><th class="num">输出</th><th class="num">耗时</th><th class="num">费用</th>
            </tr>
          </thead>
          <tbody>
            ${sampleEvents.map(e => `
              <tr>
                <td>${e.time}</td>
                <td>${e.key}</td>
                <td class="mono">${e.model}</td>
                <td>${e.result.startsWith('失败') ? `<span class="tag tag-danger">${e.result}</span>` : `<span class="tag tag-success">${e.result}</span>`}</td>
                <td class="num">${fmt(e.input)}</td>
                <td class="num">${fmt(e.output)}</td>
                <td class="num">${e.latency}</td>
                <td class="num">${fmtUSD(e.cost)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <p class="footer-note">单笔记录按部署的保留期限清理；按天统计会长期保留。</p>
      </div>
    `;
  }

  function renderAccount(auth) {
    return `
      <div class="toolbar">
        <div>
          <h1 class="page-title">账户</h1>
          <p class="page-sub">资料与密码 · <strong>演示数据</strong></p>
        </div>
      </div>
      <div class="grid-two">
        <div class="panel">
          <h3>资料</h3>
          <p><strong>用户名</strong><br /><span class="mono">${auth.username}</span></p>
          <p><strong>显示名称</strong><br />${auth.display_name || '—'}</p>
          <p class="footer-note">创建于 2026-10-20 09:00（演示）</p>
        </div>
        <div class="panel">
          <h3>修改密码</h3>
          <div class="field"><label>当前密码</label><input type="password" placeholder="演示中不会真正修改" /></div>
          <div class="field"><label>新密码</label><input type="password" placeholder="8–128 个字符" /></div>
          <div class="field"><label>确认新密码</label><input type="password" /></div>
          <button class="btn btn-primary" id="fake-password" type="button">保存（演示）</button>
          <p class="footer-note">静态页不会改动任何真实账户。</p>
        </div>
      </div>
    `;
  }

  function renderCreateModal() {
    return `
      <div class="modal-backdrop" id="modal-create">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="create-title">
          <h3 id="create-title">创建密钥</h3>
          <p>名称会显示在用量归因里。完整密钥只展示一次。</p>
          <div class="field"><label>名称</label><input id="new-key-name" placeholder="例如：笔记本" value="演示密钥" /></div>
          <div class="field"><label>到期日期</label><input type="date" disabled /><div class="footer-note">留空表示永不过期（演示固定为空）。</div></div>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="cancel-create" type="button">取消</button>
            <button class="btn btn-primary" id="confirm-create" type="button">创建</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderIssuedModal() {
    return `
      <div class="modal-backdrop" id="modal-issued">
        <div class="modal" role="dialog" aria-modal="true">
          <h3>密钥已创建</h3>
          <p>请立即复制并妥善保存。关闭后将无法再次查看完整密钥。<strong>（演示值）</strong></p>
          <div class="secret"><span>${issuedSecret}</span><button class="btn btn-ghost" id="copy-secret" type="button">复制</button></div>
          <p class="footer-note">Base URL：https://api.example.com/v1</p>
          <div class="modal-actions">
            <button class="btn btn-primary" id="close-issued" type="button">我已保存</button>
          </div>
        </div>
      </div>
    `;
  }

  function bindShell() {
    document.getElementById('sign-out')?.addEventListener('click', () => {
      saveAuth(null);
      issuedSecret = null;
      createOpen = false;
      navigate('/login');
    });
    document.getElementById('open-create')?.addEventListener('click', () => {
      createOpen = true;
      render();
    });
    document.getElementById('cancel-create')?.addEventListener('click', () => {
      createOpen = false;
      render();
    });
    document.getElementById('confirm-create')?.addEventListener('click', () => {
      const name = document.getElementById('new-key-name')?.value?.trim() || '演示密钥';
      const rand = Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);
      issuedSecret = 'sk-omc-DEMO' + rand + 'DEMO';
      sampleKeys.unshift({
        id: Date.now(),
        name,
        prefix: issuedSecret.slice(0, 12),
        last4: issuedSecret.slice(-4),
        state: 'active',
        requests: 0,
        last_used: '—',
        created: new Date().toISOString().slice(0, 16).replace('T', ' '),
      });
      createOpen = false;
      render();
    });
    document.getElementById('close-issued')?.addEventListener('click', () => {
      issuedSecret = null;
      render();
    });
    document.getElementById('copy-secret')?.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(issuedSecret); } catch {}
    });
    document.querySelectorAll('[data-revoke]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = Number(btn.getAttribute('data-revoke'));
        const k = sampleKeys.find((x) => x.id === id);
        if (k && confirm(`撤销密钥「${k.name}」？使用它的客户端将立即无法访问。（演示）`)) {
          k.state = 'revoked';
          render();
        }
      });
    });
    document.getElementById('fake-password')?.addEventListener('click', () => {
      alert('这是静态演示，密码不会被修改。');
    });
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
