<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oh My CPA · 客户门户演示</title>
<meta name="description" content="Oh My CPA P1 客户门户静态演示（侧边栏布局，演示数据，无真实后端）" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='white' font-size='14' font-family='system-ui'%3Eo%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --canvas: #eceef2;
    --bg: #ffffff;
    --elevated: #ffffff;
    --bg-surface: #f3f4f6;
    --fg: #111827;
    --fg-2: #374151;
    --muted: #6b7280;
    --meta: #9ca3af;
    --border: #e5e7eb;
    --accent: #4f46e5;
    --accent-on: #ffffff;
    --success: #059669;
    --success-bg: #ecfdf5;
    --warn: #d97706;
    --warn-bg: #fffbeb;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --neutral-bg: #f3f4f6;
    --radius-md: 8px;
    --radius-lg: 14px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.04);
    --font: "Inter", "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    --sider-w: 236px;
    --header-h: 56px;
    --motion-fast: 120ms;
    --ease: cubic-bezier(0.2, 0, 0, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #0b0d12;
      --bg: #141821;
      --elevated: #1a1f2b;
      --bg-surface: #1f2533;
      --fg: #e5e7eb;
      --fg-2: #c7CDD8;
      --muted: #9ca3af;
      --meta: #6b7280;
      --border: #2a3140;
      --accent: #818cf8;
      --accent-on: #0b0d12;
      --success: #34d399;
      --success-bg: #064e3b;
      --warn: #fbbf24;
      --warn-bg: #451a03;
      --danger: #f87171;
      --danger-bg: #450a0a;
      --neutral-bg: #1f2533;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font);
    background: var(--canvas);
    color: var(--fg);
    line-height: 1.5;
    overflow: hidden;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input { font: inherit; }

  .banner {
    position: relative; z-index: 40;
    background: linear-gradient(90deg, #4f46e5, #7c3aed);
    color: #fff; padding: 10px 16px; text-align: center; font-size: 14px;
  }
  .banner strong { font-weight: 700; }
  .banner a { color: #fff; text-decoration: underline; }

  /* ── Auth (no sidebar) ── */
  .auth-shell { height: calc(100vh - 42px); height: calc(100dvh - 42px); display: flex; flex-direction: column; overflow: auto; }
  .auth-main { flex: 1; display: grid; place-items: center; padding: 24px; }
  .auth-card {
    width: 100%; max-width: 400px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 28px 28px 20px;
  }
  .auth-brand { display: flex; justify-content: center; margin-bottom: 16px; }
  .auth-brand img { height: 28px; }
  .auth-title { margin: 0 0 8px; font-size: 22px; text-align: center; }
  .auth-sub { margin: 0 0 20px; color: var(--muted); text-align: center; font-size: 14px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--muted); }
  .field input {
    width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--bg-surface); color: var(--fg);
  }
  .field input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 9px 14px; cursor: pointer; font-weight: 560;
    background: var(--bg-surface); color: var(--fg);
  }
  .btn-primary { background: var(--accent); color: var(--accent-on); }
  .btn-ghost { background: transparent; border-color: var(--border); }
  .btn-danger { background: var(--danger-bg); color: var(--danger); }
  .btn-text { background: transparent; border: none; color: var(--fg-2); padding: 8px; }
  .btn-block { width: 100%; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin-top: 12px; }
  .error {
    background: var(--danger-bg); color: var(--danger);
    border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 12px; font-size: 14px;
  }

  /* ── App shell with left sidebar (matches AppLayout) ── */
  .app-shell {
    height: calc(100vh - 42px); height: calc(100dvh - 42px);
    display: flex; overflow: hidden; background: var(--canvas);
  }
  .app-sider {
    width: var(--sider-w); flex: none;
    display: flex; flex-direction: column;
    height: 100%; overflow: hidden;
    background: var(--canvas);
  }
  .app-brand {
    display: flex; align-items: center; gap: 8px;
    min-height: 60px; height: 60px; padding: 0 20px; cursor: pointer; flex: none;
  }
  .app-brand img { height: 20px; display: block; }
  .app-brand .suffix { font-size: 12px; color: var(--muted); font-weight: 500; }
  .app-sider-scroll { flex: 1 1 0; min-height: 0; overflow: auto; padding: 0 10px 12px; }
  .nav-group-title {
    color: var(--meta); font-size: 12px; font-weight: 500;
    padding: 16px 10px 4px;
  }
  .nav-group:first-child .nav-group-title { padding-top: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    width: 100%; margin: 1px 0; padding: 0 10px; height: 36px;
    border: none; border-radius: var(--radius-md);
    background: transparent; color: var(--fg-2);
    cursor: pointer; text-align: left; font-size: 14px; font-weight: 450;
    transition: background-color var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease);
  }
  .nav-item svg { width: 16px; height: 16px; flex: none; color: var(--muted); stroke-width: 1.75; }
  .nav-item:hover { color: var(--fg); background: color-mix(in srgb, var(--fg) 5%, transparent); }
  .nav-item:hover svg { color: var(--fg); }
  .nav-item.active {
    color: var(--fg); font-weight: 500;
    background: color-mix(in srgb, var(--fg) 8%, transparent);
  }
  .nav-item.active svg { color: var(--fg); }
  .app-sider-foot {
    flex: none; padding: 12px 14px 16px;
    border-top: 1px solid color-mix(in srgb, var(--fg) 8%, transparent);
    display: flex; flex-direction: column; gap: 8px;
  }
  .sider-user { font-size: 13px; color: var(--muted); padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sider-user strong { color: var(--fg); font-weight: 560; }

  .app-body {
    flex: 1 1 0; min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
    margin: 8px 8px 8px 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .app-header {
    flex: none; height: var(--header-h);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 0 16px 0 12px;
    border-bottom: 1px solid var(--border);
  }
  .app-header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .collapse-btn {
    width: 32px; height: 32px; border: none; border-radius: var(--radius-sm);
    background: transparent; color: var(--fg-2); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .collapse-btn:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; min-width: 0; }
  .breadcrumb .current { color: var(--fg); overflow: hidden; text-overflow: ellipsis; }
  .breadcrumb .sep { opacity: 0.5; }
  .app-content { flex: 1 1 0; min-height: 0; overflow: auto; padding: 24px; }
  .content-inner { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .page-title { margin: 0; font-size: 24px; }
  .page-sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }

  .panel {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 16px 18px;
  }
  .panel h3 { margin: 0 0 12px; font-size: 15px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .stat-label { font-size: 13px; opacity: 0.7; }
  .stat-value { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .stat-meta { font-size: 12px; opacity: 0.7; margin-top: 4px; }
  .grid-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 550; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .tag {
    display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 560;
  }
  .tag-success { background: var(--success-bg); color: var(--success); }
  .tag-warn { background: var(--warn-bg); color: var(--warn); }
  .tag-neutral { background: var(--neutral-bg); color: var(--muted); }
  .tag-danger { background: var(--danger-bg); color: var(--danger); }

  .secret {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 12px; border-radius: var(--radius-sm);
    background: var(--bg-surface); font-family: var(--mono); font-size: 13px; word-break: break-all;
  }
  .notice {
    background: color-mix(in srgb, var(--accent) 10%, var(--bg));
    border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--border));
    border-radius: var(--radius-sm); padding: 12px 14px; font-size: 14px;
  }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(15,23,42,.45);
    display: grid; place-items: center; padding: 16px; z-index: 50;
  }
  .modal {
    width: min(480px, 100%); background: var(--elevated); border-radius: var(--radius-lg);
    border: 1px solid var(--border); box-shadow: var(--shadow); padding: 20px;
  }
  .modal h3 { margin: 0 0 8px; }
  .modal p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .footer-note { color: var(--muted); font-size: 12px; margin-top: 8px; }

  .app-shell.collapsed { --sider-w: 58px; }
  .app-shell.collapsed .app-brand { justify-content: center; padding: 0; }
  .app-shell.collapsed .app-brand .suffix,
  .app-shell.collapsed .nav-group-title,
  .app-shell.collapsed .nav-item span,
  .app-shell.collapsed .sider-user,
  .app-shell.collapsed .sider-signout-label { display: none; }
  .app-shell.collapsed .nav-item { justify-content: center; padding: 0; }
  .app-shell.collapsed .app-sider-foot { align-items: center; }
  .app-shell.collapsed .wordmark-full { display: none !important; }
  .app-shell.collapsed .wordmark-mark { display: block !important; }
  .wordmark-mark { display: none; height: 20px; width: 20px; }

  .mobile-only { display: none; }
  @media (max-width: 900px) {
    .app-sider { display: none; }
    .app-shell.mobile-nav-open .app-sider {
      display: flex; position: fixed; inset: 42px auto 0 0; z-index: 30;
      box-shadow: var(--shadow); border-right: 1px solid var(--border);
    }
    .mobile-mask {
      display: none; position: fixed; inset: 42px 0 0 0; background: rgba(15,23,42,.35); z-index: 25;
    }
    .app-shell.mobile-nav-open .mobile-mask { display: block; }
    .app-body { margin: 0; border: 0; border-radius: 0; }
    .mobile-only { display: inline-flex; }
    .desktop-only { display: none !important; }
    .app-content { padding: 16px; }
  }

  .wordmark-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    .wordmark-light { display: none; }
    .wordmark-dark { display: inline; }
  }
</style>
</head>
<body>
  <div class="banner">
    <strong>静态 UI 演示 · 演示数据</strong>
    — 这不是真实 CPA / Oh My CPA 后端。密钥不会同步到网关，也无法发起真实 AI 请求。
    源码见
    <a href="https://github.com/ibi6/oh-my-cpa/tree/feat/distribution-p1" target="_blank" rel="noopener">ibi6/oh-my-cpa</a>
  </div>
  <div id="app"></div>

<script>
(() => {
  const STATE_KEY = 'omc-portal-demo-v1';
  const COLLAPSE_KEY = 'omc-portal-demo-collapsed';

  const ICONS = {
    overview: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
    keys: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="8" cy="15" r="4"/><path d="M10.5 12.5 20 3m0 0h-4m4 0v4"/><circle cx="8" cy="15" r="1.2" fill="currentColor" stroke="none"/></svg>',
    usage: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>',
    account: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/></svg>',
    menu: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    fold: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 6h10M4 12h16M4 18h10"/><path d="m15 9-3 3 3 3"/></svg>',
    unfold: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 6h16M4 12h10M4 18h16"/><path d="m12 9 3 3-3 3"/></svg>',
    logout: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>',
  };

  const NAV = [
    { group: '使用', items: [
      { path: '/overview', label: '概览', icon: 'overview', crumb: '概览' },
      { path: '/keys', label: 'API 密钥', icon: 'keys', crumb: 'API 密钥' },
      { path: '/usage', label: '使用记录', icon: 'usage', crumb: '使用记录' },
    ]},
    { group: '账户', items: [
      { path: '/account', label: '账户', icon: 'account', crumb: '账户' },
    ]},
  ];
  const ALL_ITEMS = NAV.flatMap(g => g.items);

  const sampleKeys = [
    { id: 1, name: '笔记本', prefix: 'sk-omc-RDkO', last4: 'yADn', state: 'active', requests: 1284, last_used: '2026-10-22 14:18', created: '2026-10-20 09:12' },
    { id: 2, name: 'CI', prefix: 'sk-omc-7pQm', last4: 'k2Lx', state: 'active', requests: 532, last_used: '2026-10-22 11:02', created: '2026-10-18 16:40' },
    { id: 3, name: '旧手机', prefix: 'sk-omc-ab12', last4: '9Zq1', state: 'revoked', requests: 88, last_used: '2026-10-12 08:21', created: '2026-09-30 10:00' },
  ];
  const sampleOverview = {
    window_days: 30,
    totals: { requests: 1816, failed: 23, tokens: 42580000, input: 31200000, output: 11380000, cost: 86.42 },
    last24h: { requests: 96, tokens: 2140000 },
    lifetime: { requests: 12450, tokens: 310000000 },
    models: [
      { model: 'claude-sonnet-4', requests: 980, tokens: 24100000, cost: 52.10 },
      { model: 'gpt-5', requests: 610, tokens: 14800000, cost: 28.40 },
      { model: 'gemini-2.5-pro', requests: 226, tokens: 3680000, cost: 5.92 },
    ],
    keys: [
      { name: '笔记本', requests: 1284, tokens: 30200000, cost: 61.20 },
      { name: 'CI', requests: 532, tokens: 12380000, cost: 25.22 },
    ],
    daily: [
      { day: '2026-10-22', requests: 96, failed: 2, tokens: 2140000, cost: 4.28 },
      { day: '2026-10-21', requests: 142, failed: 1, tokens: 3420000, cost: 6.91 },
      { day: '2026-10-20', requests: 118, failed: 0, tokens: 2880000, cost: 5.74 },
      { day: '2026-10-19', requests: 87, failed: 3, tokens: 1950000, cost: 3.88 },
      { day: '2026-10-18', requests: 155, failed: 4, tokens: 4010000, cost: 8.12 },
    ],
  };
  const sampleEvents = [
    { time: '2026-10-22 14:18:02', key: '笔记本', model: 'claude-sonnet-4', result: '200', input: 4200, output: 910, latency: '1.8s', cost: 0.042 },
    { time: '2026-10-22 14:12:41', key: 'CI', model: 'gpt-5', result: '200', input: 1800, output: 640, latency: '1.1s', cost: 0.021 },
    { time: '2026-10-22 13:55:09', key: '笔记本', model: 'claude-sonnet-4', result: '失败 429', input: 0, output: 0, latency: '0.2s', cost: 0 },
    { time: '2026-10-22 13:40:17', key: '笔记本', model: 'gemini-2.5-pro', result: '200', input: 2600, output: 720, latency: '2.4s', cost: 0.015 },
    { time: '2026-10-22 12:08:33', key: 'CI', model: 'gpt-5', result: '200', input: 950, output: 310, latency: '0.9s', cost: 0.011 },
    { time: '2026-10-22 11:22:05', key: '笔记本', model: 'claude-sonnet-4', result: '200', input: 5100, output: 1200, latency: '2.1s', cost: 0.051 },
  ];

  let issuedSecret = null;
  let createOpen = false;
  let authError = '';
  let mobileNavOpen = false;
  let collapsed = localStorage.getItem(COLLAPSE_KEY) === '1';

  function loadAuth() {
    try { return JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); } catch { return null; }
  }
  function saveAuth(v) {
    if (v) localStorage.setItem(STATE_KEY, JSON.stringify(v));
    else localStorage.removeItem(STATE_KEY);
  }
  function fmt(n) { return new Intl.NumberFormat('zh-CN').format(n); }
  function fmtTokens(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return fmt(n);
  }
  function fmtUSD(n) { return '$' + Number(n).toFixed(2); }

  function wordmark(full = true) {
    if (!full) {
      return `<svg class="wordmark-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#4f46e5"/><text x="16" y="22" text-anchor="middle" fill="white" font-size="14" font-family="system-ui">o</text></svg>`;
    }
    return `
      <span class="wordmark-full">
        <img class="wordmark-light" src="./omc-wordmark-light.svg" alt="Oh My CPA" />
        <img class="wordmark-dark" src="./omc-wordmark-dark.svg" alt="Oh My CPA" />
      </span>
      ${wordmark(false)}
    `;
  }

  function route() {
    const h = (location.hash || '#/login').replace(/^#/, '') || '/login';
    return h.startsWith('/') ? h : '/' + h;
  }
  function navigate(path) {
    location.hash = path.startsWith('#') ? path : '#' + path;
  }

  function render() {
    const app = document.getElementById('app');
    const path = route();
    const auth = loadAuth();

    if (!auth && path !== '/login') { navigate('/login'); return; }
    if (auth && (path === '/login' || path === '/')) { navigate('/overview'); return; }

    if (path === '/login') {
      app.innerHTML = renderLogin();
      bindLogin();
      return;
    }

    const page = {
      '/overview': renderOverview,
      '/keys': renderKeys,
      '/usage': renderUsage,
      '/account': renderAccount,
    }[path] || renderOverview;

    const item = ALL_ITEMS.find(i => i.path === path) || ALL_ITEMS[0];
    const group = NAV.find(g => g.items.some(i => i.path === item.path));

    app.innerHTML = `
      <div class="app-shell${collapsed ? ' collapsed' : ''}${mobileNavOpen ? ' mobile-nav-open' : ''}">
        <div class="mobile-mask" id="mobile-mask"></div>
        <aside class="app-sider" aria-label="客户中心导航">
          <div class="app-brand" id="brand-home" title="概览">
            ${wordmark(true)}
            <span class="suffix">客户中心</span>
          </div>
          <div class="app-sider-scroll">
            ${NAV.map(g => `
              <div class="nav-group">
                <div class="nav-group-title">${g.group}</div>
                ${g.items.map(i => `
                  <button type="button" class="nav-item${i.path === path ? ' active' : ''}" data-nav="${i.path}" title="${i.label}">
                    ${ICONS[i.icon]}<span>${i.label}</span>
                  </button>
                `).join('')}
              </div>
            `).join('')}
          </div>
          <div class="app-sider-foot">
            <div class="sider-user"><strong>${auth.display_name || auth.username}</strong></div>
            <button type="button" class="btn btn-ghost btn-block" id="sign-out" title="退出">
              ${ICONS.logout}<span class="sider-signout-label">退出</span>
            </button>
          </div>
        </aside>
        <div class="app-body">
          <header class="app-header">
            <div class="app-header-left">
              <button type="button" class="collapse-btn mobile-only" id="open-mobile-nav" aria-label="打开导航">${ICONS.menu}</button>
              <button type="button" class="collapse-btn desktop-only" id="toggle-collapse" aria-label="${collapsed ? '展开侧栏' : '收起侧栏'}">${collapsed ? ICONS.unfold : ICONS.fold}</button>
              <div class="breadcrumb">
                <span>${group ? group.group : '客户中心'}</span>
                <span class="sep">/</span>
                <span class="current">${item.crumb}</span>
              </div>
            </div>
            <div class="app-header-actions">
              <span style="font-size:12px;color:var(--muted)">演示数据</span>
            </div>
          </header>
          <main class="app-content">
            <div class="content-inner">${page(auth)}</div>
          </main>
        </div>
      </div>
      ${createOpen ? renderCreateModal() : ''}
      ${issuedSecret ? renderIssuedModal() : ''}
    `;
    bindShell();
  }

  function renderLogin() {
    return `
      <div class="auth-shell">
        <main class="auth-main">
          <section class="auth-card">
            <div class="auth-brand">${wordmark(true)}</div>
            <h1 class="auth-title">登录客户中心</h1>
            <p class="auth-sub">静态演示 · 任意非空密码即可进入（演示数据）</p>
            ${authError ? `<div class="error">${authError}</div>` : ''}
            <form id="login-form">
              <div class="field"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" value="trial" spellcheck="false" /></div>
              <div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" value="demo" /></div>
              <button class="btn btn-primary btn-block" type="submit">登录</button>
            </form>
            <p class="hint">推荐账号：<code>trial</code> / <code>demo</code></p>
          </section>
        </main>
      </div>
    `;
  }

  function bindLogin() {
    document.getElementById('login-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const form = e.target;
      const username = form.username.value.trim();
      const password = form.password.value;
      if (!username || !password) { authError = '请输入用户名和密码'; render(); return; }
      authError = '';
      saveAuth({ username, display_name: username === 'trial' ? '试用客户' : username });
      navigate('/overview');
    });
  }

  function renderOverview(auth) {
    const o = sampleOverview;
    return `
      <div class="toolbar">
        <div>
          <h1 class="page-title">${auth.display_name || auth.username}，你好</h1>
          <p class="page-sub">你的 API 使用情况 · <strong>演示数据</strong></p>
        </div>
      </div>
      <div class="notice">接入地址（演示）：<code class="mono">https://api.example.com/v1</code> — 用 API 密钥作为 Bearer。真实环境由运营方配置。</div>
      <div class="stats">
        <div class="panel"><div class="stat-label">近 ${o.window_days} 天请求</div><div class="stat-value">${fmt(o.totals.requests)}</div><div class="stat-meta">失败 ${fmt(o.totals.failed)}</div></div>
        <div class="panel"><div class="stat-label">近 ${o.window_days} 天 Token</div><div class="stat-value">${fmtTokens(o.totals.tokens)}</div><div class="stat-meta">输入 ${fmtTokens(o.totals.input)} · 输出 ${fmtTokens(o.totals.output)}</div></div>
        <div class="panel"><div class="stat-label">近 ${o.window_days} 天费用估算</div><div class="stat-value">${fmtUSD(o.totals.cost)}</div><div class="stat-meta">演示估算</div></div>
        <div class="panel"><div class="stat-label">最近 24 小时请求</div><div class="stat-value">${fmt(o.last24h.requests)}</div><div class="stat-meta">${fmtTokens(o.last24h.tokens)} Token</div></div>
        <div class="panel"><div class="stat-label">累计请求</div><div class="stat-value">${fmt(o.lifetime.requests)}</div><div class="stat-meta">${fmtTokens(o.lifetime.tokens)} Token</div></div>
      </div>
      <div class="grid-two">
        <div class="panel"><h3>按模型</h3>
          <table><thead><tr><th>模型</th><th class="num">请求</th><th class="num">Token</th><th class="num">费用</th></tr></thead>
          <tbody>${o.models.map(m => `<tr><td class="mono">${m.model}</td><td class="num">${fmt(m.requests)}</td><td class="num">${fmtTokens(m.tokens)}</td><td class="num">${fmtUSD(m.cost)}</td></tr>`).join('')}</tbody></table>
        </div>
        <div class="panel"><h3>按密钥</h3>
          <table><thead><tr><th>密钥</th><th class="num">请求</th><th class="num">Token</th><th class="num">费用</th></tr></thead>
          <tbody>${o.keys.map(k => `<tr><td>${k.name}</td><td class="num">${fmt(k.requests)}</td><td class="num">${fmtTokens(k.tokens)}</td><td class="num">${fmtUSD(k.cost)}</td></tr>`).join('')}</tbody></table>
        </div>
      </div>
      <div class="panel"><h3>按天（UTC）</h3>
        <table><thead><tr><th>日期 (UTC)</th><th class="num">失败</th><th class="num">请求</th><th class="num">Token</th><th class="num">费用</th></tr></thead>
        <tbody>${o.daily.map(d => `<tr><td>${d.day}</td><td class="num">${fmt(d.failed)}</td><td class="num">${fmt(d.requests)}</td><td class="num">${fmtTokens(d.tokens)}</td><td class="num">${fmtUSD(d.cost)}</td></tr>`).join('')}</tbody></table>
        <p class="footer-note">按天统计以 UTC 日期为准。以上均为演示数据。</p>
      </div>
    `;
  }

  function stateTag(state) {
    const map = { active: ['tag-success', '可用'], pending: ['tag-warn', '同步中'], missing: ['tag-danger', '缺失'], revoked: ['tag-neutral', '已撤销'], expired: ['tag-neutral', '已过期'], suspended: ['tag-warn', '账户已停用'] };
    const [cls, label] = map[state] || ['tag-neutral', state];
    return `<span class="tag ${cls}">${label}</span>`;
  }

  function renderKeys() {
    const active = sampleKeys.filter(k => k.state === 'active').length;
    return `
      <div class="toolbar">
        <div><h1 class="page-title">API 密钥</h1><p class="page-sub">${active} / 5 个可用 · <strong>演示数据</strong></p></div>
        <button class="btn btn-primary" id="open-create" type="button">+ 创建密钥</button>
      </div>
      <div class="panel">
        <table>
          <thead><tr><th>名称</th><th>密钥</th><th>状态</th><th class="num">请求</th><th>最近使用</th><th>创建时间</th><th></th></tr></thead>
          <tbody>
            ${sampleKeys.map(k => `
              <tr>
                <td>${k.name}</td><td class="mono">${k.prefix}…${k.last4}</td><td>${stateTag(k.state)}</td>
                <td class="num">${fmt(k.requests)}</td><td>${k.last_used}</td><td>${k.created}</td>
                <td>${k.state === 'active' ? `<button class="btn btn-danger" data-revoke="${k.id}" type="button">撤销</button>` : ''}</td>
              </tr>`).join('')}
          </tbody>
        </table>
        <p class="footer-note">真实环境中 <code>sk-omc-…</code> 会同步进 CPA；本页只是 UI 演示。</p>
      </div>
    `;
  }

  function renderUsage() {
    return `
      <div class="toolbar"><div><h1 class="page-title">使用记录</h1><p class="page-sub">你的每一次请求，最新的在前 · <strong>演示数据</strong></p></div></div>
      <div class="panel">
        <table>
          <thead><tr><th>时间</th><th>密钥</th><th>模型</th><th>结果</th><th class="num">输入</th><th class="num">输出</th><th class="num">耗时</th><th class="num">费用</th></tr></thead>
          <tbody>
            ${sampleEvents.map(e => `
              <tr>
                <td>${e.time}</td><td>${e.key}</td><td class="mono">${e.model}</td>
                <td>${e.result.startsWith('失败') ? `<span class="tag tag-danger">${e.result}</span>` : `<span class="tag tag-success">${e.result}</span>`}</td>
                <td class="num">${fmt(e.input)}</td><td class="num">${fmt(e.output)}</td><td class="num">${e.latency}</td><td class="num">${fmtUSD(e.cost)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
        <p class="footer-note">单笔记录按部署保留期限清理；按天统计会长期保留。</p>
      </div>
    `;
  }

  function renderAccount(auth) {
    return `
      <div class="toolbar"><div><h1 class="page-title">账户</h1><p class="page-sub">资料与密码 · <strong>演示数据</strong></p></div></div>
      <div class="grid-two">
        <div class="panel">
          <h3>资料</h3>
          <p><strong>用户名</strong><br /><span class="mono">${auth.username}</span></p>
          <p><strong>显示名称</strong><br />${auth.display_name || '—'}</p>
          <p class="footer-note">创建于 2026-10-20 09:00（演示）</p>
        </div>
        <div class="panel">
          <h3>修改密码</h3>
          <div class="field"><label>当前密码</label><input type="password" placeholder="演示中不会真正修改" /></div>
          <div class="field"><label>新密码</label><input type="password" placeholder="8–128 个字符" /></div>
          <div class="field"><label>确认新密码</label><input type="password" /></div>
          <button class="btn btn-primary" id="fake-password" type="button">保存（演示）</button>
        </div>
      </div>
    `;
  }

  function renderCreateModal() {
    return `
      <div class="modal-backdrop" id="modal-create">
        <div class="modal" role="dialog" aria-modal="true">
          <h3>创建密钥</h3>
          <p>名称会显示在用量归因里。完整密钥只展示一次。</p>
          <div class="field"><label>名称</label><input id="new-key-name" placeholder="例如：笔记本" value="演示密钥" /></div>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="cancel-create" type="button">取消</button>
            <button class="btn btn-primary" id="confirm-create" type="button">创建</button>
          </div>
        </div>
      </div>`;
  }

  function renderIssuedModal() {
    return `
      <div class="modal-backdrop" id="modal-issued">
        <div class="modal" role="dialog" aria-modal="true">
          <h3>密钥已创建</h3>
          <p>请立即复制并妥善保存。关闭后将无法再次查看完整密钥。<strong>（演示值）</strong></p>
          <div class="secret"><span>${issuedSecret}</span><button class="btn btn-ghost" id="copy-secret" type="button">复制</button></div>
          <p class="footer-note">Base URL：https://api.example.com/v1</p>
          <div class="modal-actions"><button class="btn btn-primary" id="close-issued" type="button">我已保存</button></div>
        </div>
      </div>`;
  }

  function bindShell() {
    document.querySelectorAll('[data-nav]').forEach(btn => {
      btn.addEventListener('click', () => {
        mobileNavOpen = false;
        navigate(btn.getAttribute('data-nav'));
      });
    });
    document.getElementById('brand-home')?.addEventListener('click', () => { mobileNavOpen = false; navigate('/overview'); });
    document.getElementById('sign-out')?.addEventListener('click', () => {
      saveAuth(null); issuedSecret = null; createOpen = false; mobileNavOpen = false; navigate('/login');
    });
    document.getElementById('toggle-collapse')?.addEventListener('click', () => {
      collapsed = !collapsed;
      localStorage.setItem(COLLAPSE_KEY, collapsed ? '1' : '0');
      render();
    });
    document.getElementById('open-mobile-nav')?.addEventListener('click', () => { mobileNavOpen = true; render(); });
    document.getElementById('mobile-mask')?.addEventListener('click', () => { mobileNavOpen = false; render(); });
    document.getElementById('open-create')?.addEventListener('click', () => { createOpen = true; render(); });
    document.getElementById('cancel-create')?.addEventListener('click', () => { createOpen = false; render(); });
    document.getElementById('confirm-create')?.addEventListener('click', () => {
      const name = document.getElementById('new-key-name')?.value?.trim() || '演示密钥';
      const rand = Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);
      issuedSecret = 'sk-omc-DEMO' + rand + 'DEMO';
      sampleKeys.unshift({ id: Date.now(), name, prefix: issuedSecret.slice(0, 12), last4: issuedSecret.slice(-4), state: 'active', requests: 0, last_used: '—', created: new Date().toISOString().slice(0, 16).replace('T', ' ') });
      createOpen = false; render();
    });
    document.getElementById('close-issued')?.addEventListener('click', () => { issuedSecret = null; render(); });
    document.getElementById('copy-secret')?.addEventListener('click', async () => { try { await navigator.clipboard.writeText(issuedSecret); } catch {} });
    document.querySelectorAll('[data-revoke]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = Number(btn.getAttribute('data-revoke'));
        const k = sampleKeys.find(x => x.id === id);
        if (k && confirm(`撤销密钥「${k.name}」？（演示）`)) { k.state = 'revoked'; render(); }
      });
    });
    document.getElementById('fake-password')?.addEventListener('click', () => alert('这是静态演示，密码不会被修改。'));
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
